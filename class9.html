    <h1>Forms</h1>
    <!-- when ever we need take input from user we use FORM. its just a container though -->
    <form action="a.html" method="" >
        <!-- the data that is shown in the url once we put our pwd and number is saved in the file that action is pointing at. -->
        <label for="email-input1">Email</label>
        <!-- label (semantic) connectes the Email text above to the input tag bellow. -->
       <input type="email" name="email" value="@gmail.com" placeholder="you@example.com" id="email-input1"/> 
       <!-- name is the key in key-value pair and value(from key-value pair) is how the backend see and save it as.if i don't put in name, the browser will not get the value at all. type is the type of input you want the user to put, this recrict the user to only put that type of data.
       value is what i've set by default(like ___@gmail.com, the gmail.com will be there by default)
       placeholder is the exapmle you want to set. id could be used as an attribute of any tag,uniquely identify an element(input here). done just for label here. it's like a roll no.. -->
       <input type="">
       <label for="password">Password</label>
       <input name="password" type="password" placeholder="Enter your password" id="password"/>
       <input type="submit"/><br><br>
        <label for="color">color</label>
       <input name="color" type="color" id="color"/>
