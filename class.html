    <h1>Forms</h1>
    <!-- when ever we need take input from user we use FORM. its just a container though -->
    <form action="x.html" method="post">
        <!-- to hide sensitive data we use 'post' instead of 'get' in method attribute. in general get takes/gets a data and post creates a data.-->
        <label for="email-input1">Email</label>
       <input type="email" name="email" value="@gmail.com" placeholder="you@example.com" id="email-input1" min="4" max="10" required/> 
       <br><br>
        <label for="name">Name</label>
       <input type="text" name="name" placeholder="name" id="name" required/> 
<br><br>
       <label for="password">Password</label>
       <input name="password" type="password" placeholder="Enter your password" id="password" min="2" max="8" required/>
       <br> <br>
       <input type="submit" value="submit response"/><br><br>
        <label for="color">color</label>
       <input name="color" type="color" id="color"/>
       

      
       
    </form>
